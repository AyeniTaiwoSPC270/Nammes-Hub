<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #04160c;
    background-image: radial-gradient(#0b2a18 1.7px, transparent 1.8px);
    background-size: 28px 28px;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #fcf9f8;
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 90px;
  }
  .ring { position: absolute; inset: 46px; border: 2px solid rgba(252,249,248,.16); border-radius: 40px; }
  .crest { width: 300px; height: 307px; }
  .wordmark { margin-top: 54px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900;
    font-size: 116px; line-height: 1; color: #fcf9f8; }
  .rule { margin-top: 40px; width: 260px; height: 6px; background: #ff5a1f; border-radius: 3px; }
  .tagline { margin-top: 40px; font-family: 'Playfair Display', Georgia, serif; font-weight: 700;
    font-size: 54px; font-style: italic; color: #e6f0ea; }
  .features { margin-top: 64px; font-size: 26px; font-weight: 600; letter-spacing: 7px;
    color: #ffb38f; text-transform: uppercase; line-height: 2.2; max-width: 820px; }
  .pill { position: absolute; bottom: 96px; background: #ff5a1f; color: #ffffff; border-radius: 999px;
    padding: 26px 54px; font-weight: 800; font-size: 39px; box-shadow: 0 0 0 5px #ff5a1f,
    0 16px 40px rgba(0,0,0,.5); }
  .note { position: absolute; top: 96px; font-size: 24px; font-weight: 700; letter-spacing: 6px;
    color: #efeae2; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="note">NOW LIVE</div>

  <img class="crest" src="../public/logo.png" alt="">
  <div class="wordmark">NAMMES Hub</div>
  <div class="rule"></div>
  <div class="tagline">Built by students, for students.</div>
  <div class="features">Outlines · Timetables · CGPA<br>Events · Opportunities · Forms · News</div>

  <div class="pill">nammeshub.com.ng</div>
</body>
</html>
