<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #04160c;
    background-image: radial-gradient(#0b2a18 1.7px, transparent 1.8px);
    background-size: 28px 28px;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #fcf9f8;
    position: relative;
    padding: 74px 70px;
  }
  .blob-green { position: absolute; top: -220px; left: -180px; width: 640px; height: 640px;
    border-radius: 50%; background: #0a381d; }
  .blob-brown { position: absolute; bottom: -230px; right: -160px; width: 620px; height: 620px;
    border-radius: 50%; background: #2e2513; }
  .eyebrow { position: relative; font-weight: 800; letter-spacing: 6px; font-size: 25px;
    color: #ffb38f; text-transform: uppercase; }
  h1 { position: relative; margin-top: 18px; font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900; font-size: 96px; line-height: 1.04; color: #fcf9f8; }
  .browser { position: relative; margin-top: 52px; background: #ffffff; border-radius: 22px;
    overflow: hidden; box-shadow: 0 34px 70px rgba(0,0,0,.55); }
  .bar { height: 66px; background: #efeae2; display: flex; align-items: center; gap: 13px;
    padding: 0 26px; border-bottom: 2px solid rgba(12,23,16,.1); }
  .dot { width: 19px; height: 19px; border-radius: 50%; }
  .url { flex: 1; margin-left: 16px; background: #ffffff; border: 2px solid rgba(12,23,16,.14);
    border-radius: 999px; height: 38px; display: flex; align-items: center; padding: 0 22px;
    font-size: 22px; color: #0c1710; font-weight: 600; }
  .shot { display: block; width: 100%; height: 560px; object-fit: cover; object-position: top center; }
  .pills { position: relative; margin-top: 46px; display: flex; flex-wrap: wrap; gap: 22px; }
  .pill { border-radius: 999px; padding: 20px 36px; font-weight: 800; font-size: 33px;
    border: 4px solid #04160c; }
  .pill-o { background: #ff5a1f; color: #ffffff; box-shadow: 0 0 0 4px #ff5a1f; }
  .pill-y { background: #f4c430; color: #0c1710; box-shadow: 0 0 0 4px #f4c430; }
  .pill-c { background: #fcf9f8; color: #0c1710; box-shadow: 0 0 0 4px #fcf9f8; }
  .foot { position: absolute; left: 70px; right: 70px; bottom: 66px; display: flex;
    align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 800; letter-spacing: 4px;
    font-size: 26px; color: #efeae2; }
  .brand img { width: 62px; height: 64px; }
  .domain { background: #fcf9f8; color: #0c1710; border-radius: 999px; padding: 20px 40px;
    font-weight: 800; font-size: 34px; box-shadow: 0 0 0 4px #fcf9f8; }
</style>
</head>
<body>
  <div class="blob-green"></div>
  <div class="blob-brown"></div>

  <div class="eyebrow">NAMMES, UNILAG</div>
  <h1>Meet NAMMES Hub.</h1>

  <div class="browser">
    <div class="bar">
      <span class="dot" style="background:#ff5a1f"></span>
      <span class="dot" style="background:#f4c430"></span>
      <span class="dot" style="background:#145c30"></span>
      <span class="url">nammeshub.com.ng</span>
    </div>
    <img class="shot" src="../public/screens/home.png" alt="">
  </div>

  <div class="pills">
    <span class="pill pill-o">Grades in. CGPA out.</span>
    <span class="pill pill-y">Sorted by deadline</span>
    <span class="pill pill-c">Relive every event.</span>
  </div>

  <div class="foot">
    <div class="brand"><img src="../public/logo.png" alt="">NAMMES HUB</div>
    <div class="domain">Everything. One address.</div>
  </div>
</body>
</html>
